# Temporary: compares build variants of the pinned sources (Emscripten 4.0.6; C code as configured
# with --enable-debug, i.e. without -O2, vs with -O2 restored at make time). Removed after use.
name: tmp emsdk probe

on:
  push:
    paths:
      - .github/workflows/tmp-emsdk-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        opt: [configured, o2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends autoconf automake libtool pkg-config texinfo
      - name: Variant
        if: matrix.opt == 'o2'
        run: |
          sed -i 's|^emmake make -j"$JOBS" -C src$|grep "^CFLAGS = " src/Makefile; emmake make -j"$JOBS" -C src CFLAGS="$(sed -n "s/^CFLAGS = //p" src/Makefile) -O2"|' tools/build_dwg_wasm.sh
          grep -n "emmake make" tools/build_dwg_wasm.sh
      - name: Build
        env:
          EMSDK_VERSION: 4.0.6
          EMSDK_COMMIT: 24fc909c0da13ef641d5ae75e89b5a97f25e37aa
          OUT: ${{ runner.temp }}/out
          INSTALL: '0'
        run: |
          bash tools/build_dwg_wasm.sh > build.log 2>&1 || { tail -n 60 build.log; exit 1; }
          grep -n "^CFLAGS = \|LibreDWG 0\|objects$\|no local paths\|warning: a local" build.log || true
          sed -n '/==== output/,$p' build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.opt }}
          path: ${{ runner.temp }}/out/
          retention-days: 3
